<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- آیکون تب مرورگر: همان لوگوی سایت -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- فقط DNS از قبل حل شود. preconnect عمداً حذف شده: سوکتِ از پیش
         بازشده به این سرور در عمل باعث ERR_CONNECTION_TIMED_OUT روی اولین
         درخواست‌های صفحه می‌شد. -->
    <link rel="dns-prefetch" href="https://api.farazchaman.ir" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="فراز چمن - فروش و نصب تخصصی چمن مصنوعی با بهترین کیفیت و خدمات پس از فروش در سراسر کشور" />

    <!-- ══════════════════════════════════════════════════════════════
         عدم نمایه‌سازی در موتورهای جست‌وجو (noindex)

         تیکِ noindex در وردپرس فقط روی خودِ api.farazchaman.ir اثر دارد،
         نه روی این سایت؛ چون این‌جا یک سایت جداست و صفحاتش را وردپرس
         تولید نمی‌کند. پس همان تنظیم این‌جا هم صریح اعمال شده است.

         ‼️ هنگام رونمایی سایت: این تگ و همچنین سطر Disallow در فایل
            public/robots.txt را حذف کنید، وگرنه گوگل سایت را ثبت نمی‌کند.
         ══════════════════════════════════════════════════════════════ -->
    <meta name="robots" content="noindex, nofollow" />
    <title>فراز چمن | فروش و نصب چمن مصنوعی</title>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-var.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
